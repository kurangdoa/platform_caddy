services:
  caddy:
    image: caddy:2-alpine
    container_name: global-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Optional: enables HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - movie-network
      - langfuse-network
      - mlflow-network

volumes:
  caddy_data:
  caddy_config:

networks:
  movie-network:
    external: true
  langfuse-network:
    external: true
  mlflow-network:
    external: true